server:
  port: 8080
  servlet:
    # servidor local do contrato: http://localhost:8080/v1
    context-path: /v1

spring:
  application:
    name: morah-backend
  datasource:
    # banco SQLite em arquivo na raiz do projeto (criado na primeira execução);
    # as datas são gravadas como texto legível (instantes em UTC)
    url: jdbc:sqlite:morah.db?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS
    driver-class-name: org.sqlite.JDBC
    hikari:
      # o SQLite só aceita um escritor por vez: uma conexão evita "database is locked"
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: true
    # roda o data.sql depois que o Hibernate cria as tabelas
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  web:
    # mensagens do Bean Validation sempre em português
    locale: pt_BR
    locale-resolver: fixed
  jackson:
    # campos nulos não aparecem no JSON
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# segredos de DESENVOLVIMENTO (em produção viriam de variáveis de ambiente)
morah:
  jwt:
    segredo: morah-segredo-jwt-desenvolvimento-com-mais-de-32-bytes
  webhook:
    segredo: morah-segredo-webhook-desenvolvimento
