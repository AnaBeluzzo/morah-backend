# -------------------------------------------
# Telosys project configuration
# -------------------------------------------
# --- Project folders (standard variables)
SRC=src/main/java
RES=src/main/resources
WEB=src/main/webapp
TEST_SRC=src/test/java
TEST_RES=src/test/resources
#SRC=src
#RES=res
#WEB=WebContent
#TEST_SRC=src
#TEST_RES=
DOC=doc
TMP=tmp
# --- Project Packages (standard variables)
ROOT_PKG=br.com.morah.gerado
ENTITY_PKG=br.com.morah.gerado.persistence

# -------------------------------------------
# --- Project Variables
ProjectVariable.MAVEN_ARTIFACT_ID=morah-gerado
ProjectVariable.MAVEN_GROUP_ID=br.com.morah
ProjectVariable.PROJECT_NAME=morah-gerado
ProjectVariable.PROJECT_VERSION=0.1
# REST backend configuration
ProjectVariable.REST_SERVER_PORT=8081
ProjectVariable.REST_API_ROOT=/api
ProjectVariable.REST_URL_ROOT=http://localhost:8081
# Database configuration (SQLite do morah-backend)
ProjectVariable.DB_HOST=localhost
ProjectVariable.DB_PORT=5432
ProjectVariable.DB_NAME=postgres
ProjectVariable.DB_SCHEMA=myschema
# a aplicação gerada usa uma CÓPIA do banco (morah-demo.db), para a demonstração não mexer no banco do backend
ProjectVariable.DB_JDBC_URL="jdbc:sqlite:morah-demo.db?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS"
ProjectVariable.DB_USER=admin
ProjectVariable.DB_PASSWORD=
ProjectVariable.DB_JDBC_DRIVER_CLASS=org.sqlite.JDBC
ProjectVariable.DB_JPA_DIALECT=org.hibernate.community.dialect.SQLiteDialect

