#---------------------------------------------------------
# Bundle "morah-telas-crud": telas HTML de CRUD geradas a partir do modelo do banco
# (servidas como recursos estáticos pelo backend gerado com o bundle java-rest-springboot3-sqlite)
# . valor 1 : rótulo
# . valor 2 : arquivo gerado
# . valor 3 : pasta de destino
# . valor 4 : template
# . valor 5 : "1" = uma vez para todas as entidades (padrão: uma vez por entidade)
#---------------------------------------------------------
Índice das telas ; index.html       ; ${RES}/static          ; index_html.vm  ; 1
Script genérico  ; crud.js          ; ${RES}/static          ; crud_js.vm     ; 1
Estilos          ; crud.css         ; ${RES}/static          ; crud_css.vm    ; 1
Tela de CRUD     ; ${ENT_LC}.html ; ${RES}/static/telas ; Xxx_html.vm
