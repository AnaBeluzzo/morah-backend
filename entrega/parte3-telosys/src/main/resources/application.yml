#--- server config
server:
  port: 8081

#--- spring config
spring:
#   application:
#     name: My basic application
#   profiles:
#     active: default
#   main:
#     banner-mode: off
  datasource:
    # Configure your datasource here :
    driver-class-name: org.sqlite.JDBC
    url: "jdbc:sqlite:morah-demo.db?date_class=TEXT&date_string_format=yyyy-MM-dd HH:mm:ss.SSS"
    username: admin
    password: 
#  hikari:
#    schema: XXXX # with Derby schema name = user name
  jpa:
    # Configure JPA-Hibernate here :
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none  # none, update, create, create-drop, validate
    show-sql: true
    open-in-view: false # "Open Session In View" : true by default with Spring
#   properties:
#     hibernate.default_schema: XXXX
#
#--- logging config
logging:
  level:
    br.com.morah.gerado: DEBUG
#      br.com.morah.gerado.persistence: DEBUG
#      br.com.morah.gerado.rest.controllers: DEBUG
#      br.com.morah.gerado.rest.services: DEBUG

#--- application config
rest:
  api-root: /api
